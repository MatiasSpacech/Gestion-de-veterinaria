appId: com.vetgestion.app
productName: VetGestión
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: VetGestion-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
